[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iflow-mcp_fusedio_fused-mcp"
version = "0.1.2"
description = "Fused MCP: Setting up MCP Servers for Data Scientists"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.49.0",
    "fused[all]>=1.15.0",
    "jupyterlab>=4.3.6",
    "mcp[cli]>=1.4.1",
    "python-dotenv>=1.0.1",
]

[project.scripts]
iflow-mcp-fusedio-fused-mcp = "iflow_mcp_fusedio_fused_mcp.main:main"

[tool.setuptools]
packages = ["iflow_mcp_fusedio_fused_mcp"]

[tool.setuptools.package-dir]
iflow_mcp_fusedio_fused_mcp = "."

[tool.setuptools.package-data]
"*" = ["*.py", "*.txt", "*.md", "*.json", "agents.json"]

[tool.setuptools.exclude-package-data]
"*" = ["test_*.py", ".*"]